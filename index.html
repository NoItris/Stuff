<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Hunter</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#1c1b19;--muted:#6b675f;--accent:#d9480f;--accent-t:#fff;--line:#e6e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#211f1c;--text:#f2efe9;--muted:#a09a8f;--accent:#ff8a4c;--accent-t:#1a1008;--line:#37332d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font:700 30px/1.1 Georgia,serif;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
button{padding:13px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-weight:600;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.card .t{flex:1;min-width:0}
.code{font:700 17px ui-monospace,Menlo,monospace;letter-spacing:.04em}
.card p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.copy{padding:8px 12px;font-size:14px}
.src{font-size:13px;color:var(--muted);margin:2px 0}
.src a{color:var(--accent)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Code Hunter</h1>
  <p class="sub">Enter a store’s website to pull its current discount codes.</p>
  <div class="row">
    <input id="site" placeholder="e.g. nike.com" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button id="go">Find</button>
  </div>
  <section id="out" class="hidden">
    <h2 id="head">Codes</h2>
    <div id="codes"></div>
    <h2>Sources checked</h2>
    <div id="srcs"></div>
    <p class="note">Codes are collected automatically and may be expired. Always test at checkout.</p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

async function run() {
  const site = $('site').value.trim();
  if (!site) return;
  $('go').disabled = true; $('out').classList.remove('hidden');
  $('head').textContent = 'Searching…'; $('codes').textContent = ''; $('srcs').textContent = '';
  try {
    const r = await fetch('/api/codes?site=' + encodeURIComponent(site));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    $('head').textContent = d.codes.length ? d.codes.length + ' code' + (d.codes.length > 1 ? 's' : '') + ' for ' + d.site : 'No codes found for ' + d.site;
    d.codes.forEach(c => {
      const card = mk('div', 'card'), t = mk('div', 't');
      t.append(mk('div', 'code', c.code), mk('p', '', (c.description || '') + (c.description ? ' · ' : '') + c.source));
      const b = mk('button', 'copy', 'Copy');
      b.onclick = async () => { try { await navigator.clipboard.writeText(c.code); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); } catch { b.textContent = c.code; } };
      card.append(t, b); $('codes').append(card);
    });
    d.sources.forEach(s => {
      const p = mk('p', 'src'), a = mk('a', '', s.name);
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      p.append(a, document.createTextNode(' — ' + s.status)); $('srcs').append(p);
    });
  } catch (e) { $('head').textContent = e.message; }
  $('go').disabled = false;
}
$('go').onclick = run;
$('site').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
